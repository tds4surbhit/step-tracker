spring:
  application:
    name: step-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/steptracker}
    username: ${DB_USERNAME:steptracker}
    password: ${DB_PASSWORD:steptracker}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:0}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-every-real-environment}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
